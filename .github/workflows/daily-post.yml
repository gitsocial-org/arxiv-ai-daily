name: Daily arXiv AI Papers

on:
  schedule:
    - cron: '17 1,9,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-arxiv-papers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for auto-backfill to detect last paper commit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "arXiv AI Bot"
          git config user.email "bot@gitsocial.org"

      - name: Fetch and commit arXiv AI papers
        run: ./scripts/commit.sh

      - name: Push changes
        run: git push origin main || (sleep 10 && git pull --rebase && git push origin main)
